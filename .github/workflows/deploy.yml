name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --working-dir=api --no-dev --no-interaction --prefer-dist

      - name: Test PHP security primitives
        run: composer run --working-dir=api test

      - name: Install dependencies
        run: npm ci

      - name: Test FER preview
        run: npm run test:fer

      - name: Test document learning
        run: npm run test:documents

      - name: Test invoice parser
        run: npm run test:invoice-parser

      - name: Test foreign currencies
        run: npm run test:forex

      - name: Test financial report periods
        run: npm run test:reports

      - name: Test dashboard metrics
        run: npm run test:dashboard

      - name: Test loading indicators
        run: npm run test:loading

      - name: Build
        run: npm run build

      # ────────────────────────────────────────────────────────────────────────
      # FTP Deploy
      #
      # Deploys ./dist/ to the web root defined in FTP_SERVER_DIR.
      # dangerous-clean-slate: false avoids deleting the entire remote directory.
      # The sync can still remove previously deployed files unless excluded.
      #
      # Protected on server (will never be touched):
      #   • api/config.php        – credentials (gitignored, not in dist)
      #   • api/uploads/**        – user-uploaded files
      #   • api/uploads/*/        – all subdirectories with uploaded content
      # ────────────────────────────────────────────────────────────────────────
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:      ${{ secrets.FTP_SERVER }}
          username:    ${{ secrets.FTP_USERNAME }}
          password:    ${{ secrets.FTP_PASSWORD }}
          port:        21
          protocol:    ftps
          security:    strict
          server-dir:  ${{ secrets.FTP_SERVER_DIR }}
          local-dir:   ./dist/
          exclude: |
            **/.git*
            **/.git*/**
            api/config.php
            api/uploads/**
          dangerous-clean-slate: false
          log-level: minimal
